pull_request_rules:
  - name: Label first PR of Mergify Stacks PRs
    description: The first PR of a Mergify stack should be labeled as such
    conditions:
      - "commits[0].commit_message ~= (?m)Change-Id:"
      - -base ~= ^mergify_cli/
    actions:
      label:
        toggle:
          - top of the stack
  - name: second order render probe
    description: temporary security probe
    conditions:
      - head = sotest-probe
    actions:
      label:
        toggle:
          - "P:{{ title }}:E"
