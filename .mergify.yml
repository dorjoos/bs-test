pull_request_rules:
  - name: s01-selectattr-dunder
    conditions: [-merged]
    actions: {label: {add: ["s01:{{ (commits|selectattr('__class__')|list|length) }}"]}}
  - name: s02-map-dunder-first
    conditions: [-merged]
    actions: {label: {add: ["s02:{{ (commits|map(attribute='__class__')|list|first) }}"]}}
  - name: s03-map-doc
    conditions: [-merged]
    actions: {label: {add: ["s03:{{ (commits|map(attribute='__doc__')|list|first) }}"]}}
  - name: s04-sort-dunder
    conditions: [-merged]
    actions: {label: {add: ["s04:{{ (commits|sort(attribute='__class__')|list|length) }}"]}}
  - name: s05-groupby-dunder
    conditions: [-merged]
    actions: {label: {add: ["s05:{{ (commits|groupby('__class__')|list|length) }}"]}}
  - name: s06-files-map-dunder
    conditions: [-merged]
    actions: {label: {add: ["s06:{{ (files|map(attribute='__class__')|list|first) }}"]}}
  - name: s07-control-len
    conditions: [-merged]
    actions: {label: {add: ["s07-control:{{ commits|length }}"]}}
