pull_request_rules:
  - name: q01-debug-ext
    conditions: [-merged]
    actions: {label: {add: ["q01:{% debug %}"]}}
  - name: q02-do-ext
    conditions: [-merged]
    actions: {label: {add: ["q02:{% do namespace(a=1) %}"]}}
  - name: q03-with
    conditions: [-merged]
    actions: {label: {add: ["q03:{% with x=cycler %}{{ x }}{% endwith %}"]}}
  - name: q04-filter-block
    conditions: [-merged]
    actions: {label: {add: ["q04:{% filter upper %}z{% endfilter %}"]}}
  - name: q05-call-block
    conditions: [-merged]
    actions: {label: {add: ["q05:{% macro m() %}{{ caller() }}{% endmacro %}{% call m() %}z{% endcall %}"]}}
  - name: q06-loop-obj
    conditions: [-merged]
    actions: {label: {add: ["q06:{% for i in range(1) %}{{ loop }}{% endfor %}"]}}
  - name: q07-loop-cycle
    conditions: [-merged]
    actions: {label: {add: ["q07:{% for i in range(1) %}{{ loop.cycle }}{% endfor %}"]}}
  - name: q08-macro-caller
    conditions: [-merged]
    actions: {label: {add: ["q08:{% macro m() %}z{% endmacro %}{{ m.caller }}{{ m.catch_varargs }}"]}}
  - name: q09-self-call
    conditions: [-merged]
    actions: {label: {add: ["q09:{% block b %}q{% endblock %}{{ self.b() }}"]}}
  - name: q10-namespace-mutate
    conditions: [-merged]
    actions: {label: {add: ["q10:{% set ns = namespace(x=cycler) %}{{ ns.x }}"]}}
  - name: q11-cycler-bound
    conditions: [-merged]
    actions: {label: {add: ["q11:{{ cycler(1,2).next() }}{{ cycler(1,2).items }}"]}}
  - name: q12-joiner-call
    conditions: [-merged]
    actions: {label: {add: ["q12:{{ joiner('-')() }}"]}}
  - name: q13-markdownify-html
    conditions: [-merged]
    actions: {label: {add: ["q13:{{ '[x](javascript:alert(1))'|markdownify }}"]}}
  - name: q14-getsection-attr
    conditions: [-merged]
    actions: {label: {add: ["q14:{{ get_section.__name__ }}"]}}
  - name: q15-selfattr-context
    conditions: [-merged]
    actions: {label: {add: ["q15:{{ self.blocks }}{{ self.name }}"]}}
